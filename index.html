<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Life Tracker</title>

<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="css/style.css">

<meta name="theme-color" content="#16a34a">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

</head>

<body>

<div class="app">

<header class="header">

<div>
<h1>🌿 Life Tracker</h1>
<p>Build Better Habits Every Day</p>
</div>

<div class="profile">

<div class="avatar">
MS
</div>

</div>

</header>

<section class="welcome">

<h2 id="greeting">
Good Morning 👋
</h2>

<p id="todayDate"></p>

</section>

<section class="motivation">

<h3>Today's Motivation</h3>

<p id="quote">

Success is the sum of small efforts repeated every day.

</p>

</section>

<section class="progressCard">

<div class="progressHeader">

<span>Today's Progress</span>

<span id="progressText">0%</span>

</div>

<div class="progressBar">

<div
class="progressFill"
id="progressFill">
</div>

</div>

</section>

<section class="quickStats">

<div class="stat">

<h2 id="taskCount">

0

</h2>

<p>Tasks</p>

</div>

<div class="stat">

<h2 id="habitCount">

0

</h2>

<p>Habits</p>

</div>

<div class="stat">

<h2 id="doneCount">

0

</h2>

<p>Completed</p>

</div>

</section>

<section class="taskSection">

<div class="sectionTitle">

<h2>Today's Tasks</h2>

</div>

<div class="taskInput">

<input
type="text"
id="taskInput"
placeholder="নতুন Task লিখুন...">

<button
id="addTask">

Add

</button>

</div>

<ul id="taskList">

</ul>

                          </section>
                          <section class="trackerGrid">

    <div class="trackerCard">
        <h3>💧 Water Tracker</h3>

        <div class="counter">

            <button id="waterMinus">-</button>

            <span id="waterCount">0</span>

            <button id="waterPlus">+</button>

        </div>

        <p>Glasses Today</p>

    </div>



    <div class="trackerCard">

        <h3>🕌 Prayer Tracker</h3>

        <div class="checkList">

            <label><input type="checkbox"> ফজর</label>

            <label><input type="checkbox"> যোহর</label>

            <label><input type="checkbox"> আসর</label>

            <label><input type="checkbox"> মাগরিব</label>

            <label><input type="checkbox"> এশা</label>

        </div>

    </div>



    <div class="trackerCard">

        <h3>📚 Study</h3>

        <textarea
        id="studyNote"
        placeholder="আজ কী পড়বেন?"></textarea>

    </div>



    <div class="trackerCard">

        <h3>😴 Sleep</h3>

        <input
        type="time"
        id="sleepTime">

    </div>

</section>



<section class="notes">

<h2>📝 Notes</h2>

<textarea id="noteBox" placeholder="আজকের গুরুত্বপূর্ণ নোট লিখুন..."></textarea>

</section>



<footer>

<div class="bottomNav">

<button>🏠</button>

<button>📅</button>

<button>📊</button>

<button>⚙️</button>

</div>

</footer>


<button class="floatingBtn" id="floatingAdd">+</button>

</div>



<script src="js/app.js"></script>

</body>

    </html>
