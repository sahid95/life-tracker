<!DOCTYPE html>
<html lang="bn" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Life Tracker</title>
    <link rel="manifest" href="data:application/json;base64,ewogICJuYW1lIjogIkxpZmUgVHJhY2tlciIsCiAgInNob3J0X25hbWUiOiAiVHJhY2tlciIsCiAgInN0YXJ0X3VybCI6ICIuIiwKICAiZGlzcGxheSI6ICJzdGFuZGFsb25lIiwKICAiYmFja2dyb3VuZF9jb2xvciI6ICIjMGYxNzJhIiwKICAidGhlbWVfY29sb3IiOiAiIzBmMTcyYSIKfQ==">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .glass-card { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.08); }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen pb-24 font-sans">

    <!-- Header Section -->
    <header class="p-5 max-w-md mx-auto flex justify-between items-center glass-card rounded-b-2xl sticky top-0 z-40 border-t-0">
        <div>
            <h1 class="text-xl font-bold bg-gradient-to-r from-blue-400 to-emerald-400 bg-clip-text text-transparent">
                👋 Good Day, Md Shade
            </h1>
            <p id="current-datetime" class="text-xs text-slate-400 mt-1"></p>
        </div>
        <button onclick="toggleSettings()" class="p-2 bg-slate-800 rounded-full hover:bg-slate-700 transition">
            <i data-lucide="settings" class="w-5 h-5 text-slate-300"></i>
        </button>
    </header>

    <main class="max-w-md mx-auto p-4 space-y-5">

        <!-- Motivational Quote -->
        <div class="glass-card p-4 rounded-2xl border-l-4 border-emerald-500">
            <p class="text-xs text-emerald-400 font-semibold mb-1">💡 আজকের অনুপ্রেরণা</p>
            <p id="quote" class="text-sm italic text-slate-300">"প্রতিদিনের ছোট ছোট উন্নতি দিনশেষে বড় পরিবর্তন আনে।"</p>
        </div>

        <!-- Daily Progress -->
        <div class="glass-card p-5 rounded-2xl">
            <div class="flex justify-between items-center mb-2">
                <span class="text-sm font-semibold text-slate-300">📊 Daily Progress</span>
                <span id="progress-text" class="text-sm font-bold text-blue-400">0%</span>
            </div>
            <div class="w-full bg-slate-800 h-3 rounded-full overflow-hidden">
                <div id="progress-bar" class="bg-gradient-to-r from-blue-500 to-emerald-400 h-full w-0 transition-all duration-500"></div>
            </div>
        </div>

        <!-- Trackers Grid -->
        <div class="grid grid-cols-2 gap-3">
            <!-- Water Tracker -->
            <div class="glass-card p-4 rounded-2xl flex flex-col justify-between">
                <div class="flex justify-between items-center">
                    <span class="text-xs font-semibold text-blue-400">💧 Water</span>
                    <i data-lucide="droplet" class="w-4 h-4 text-blue-400"></i>
                </div>
                <div class="my-3 text-center">
                    <span id="water-count" class="text-2xl font-bold">0</span> <span class="text-xs text-slate-400">/ 8 glass</span>
                </div>
                <button onclick="addWater()" class="w-full py-1.5 bg-blue-600/30 hover:bg-blue-600/50 text-blue-300 text-xs rounded-xl font-medium border border-blue-500/30 transition">+1 Glass</button>
            </div>

            <!-- Sleep Tracker -->
            <div class="glass-card p-4 rounded-2xl flex flex-col justify-between">
                <div class="flex justify-between items-center">
                    <span class="text-xs font-semibold text-indigo-400">😴 Sleep</span>
                    <i data-lucide="moon" class="w-4 h-4 text-indigo-400"></i>
                </div>
                <div class="my-3 text-center">
                    <span id="sleep-count" class="text-2xl font-bold">0</span> <span class="text-xs text-slate-400">/ 8 hrs</span>
                </div>
                <button onclick="addSleep()" class="w-full py-1.5 bg-indigo-600/30 hover:bg-indigo-600/50 text-indigo-300 text-xs rounded-xl font-medium border border-indigo-500/30 transition">+1 Hour</button>
            </div>
        </div>

        <!-- Prayer & Study Trackers -->
        <div class="grid grid-cols-2 gap-3">
            <!-- Prayer Tracker -->
            <div class="glass-card p-4 rounded-2xl">
                <div class="flex justify-between items-center mb-2">
                    <span class="text-xs font-semibold text-emerald-400">🕌 Prayer</span>
                    <span id="prayer-count" class="text-xs font-bold text-slate-400">0/5</span>
                </div>
                <div class="flex justify-between gap-1">
                    <button onclick="togglePrayer(this)" class="w-6 h-6 rounded-full bg-slate-800 text-[10px] font-bold border border-slate-700">F</button>
                    <button onclick="togglePrayer(this)" class="w-6 h-6 rounded-full bg-slate-800 text-[10px] font-bold border border-slate-700">D</button>
                    <button onclick="togglePrayer(this)" class="w-6 h-6 rounded-full bg-slate-800 text-[10px] font-bold border border-slate-700">A</button>
                    <button onclick="togglePrayer(this)" class="w-6 h-6 rounded-full bg-slate-800 text-[10px] font-bold border border-slate-700">M</button>
                    <button onclick="togglePrayer(this)" class="w-6 h-6 rounded-full bg-slate-800 text-[10px] font-bold border border-slate-700">I</button>
                </div>
            </div>

            <!-- Study Tracker -->
            <div class="glass-card p-4 rounded-2xl flex flex-col justify-between">
                <div class="flex justify-between items-center">
                    <span class="text-xs font-semibold text-amber-400">📚 Study</span>
                    <i data-lucide="book-open" class="w-4 h-4 text-amber-400"></i>
                </div>
                <div class="my-1 text-center">
                    <span id="study-count" class="text-2xl font-bold">0</span> <span class="text-xs text-slate-400">/ hrs</span>
                </div>
                <button onclick="addStudy()" class="w-full py-1.5 bg-amber-600/30 hover:bg-amber-600/50 text-amber-300 text-xs rounded-xl font-medium border border-amber-500/30 transition">+30 Min</button>
            </div>
        </div>

        <!-- Today's Tasks -->
        <div class="glass-card p-5 rounded-2xl space-y-3">
            <h2 class="text-sm font-semibold text-slate-300 flex items-center gap-2">
                <i data-lucide="check-square" class="w-4 h-4 text-emerald-400"></i> Today's Tasks
            </h2>
            <ul id="task-list" class="space-y-2">
                <!-- Tasks will be rendered here -->
            </ul>
        </div>

        <!-- Reports & Calendar Card -->
        <div class="glass-card p-5 rounded-2xl space-y-2">
            <div class="flex justify-between items-center">
                <span class="text-sm font-semibold text-slate-300">📈 Weekly Performance</span>
                <span class="text-xs text-emerald-400 font-bold">+12% vs last week</span>
            </div>
            <div class="flex items-end gap-2 h-20 pt-4">
                <div class="flex-1 bg-blue-500/20 rounded-t h-[40%]"></div>
                <div class="flex-1 bg-blue-500/20 rounded-t h-[60%]"></div>
                <div class="flex-1 bg-blue-500/20 rounded-t h-[30%]"></div>
                <div class="flex-1 bg-blue-500/20 rounded-t h-[80%]"></div>
                <div class="flex-1 bg-blue-500/20 rounded-t h-[50%]"></div>
                <div class="flex-1 bg-blue-500/20 rounded-t h-[90%]"></div>
                <div class="flex-1 bg-emerald-500 rounded-t h-[100%]"></div>
            </div>
        </div>

    </main>

    <!-- Floating Add Button -->
    <button onclick="addTaskPrompt()" class="fixed bottom-6 right-6 w-14 h-14 bg-gradient-to-r from-blue-500 to-emerald-400 rounded-full flex items-center justify-center shadow-lg shadow-blue-500/30 hover:scale-105 active:scale-95 transition z-50">
        <i data-lucide="plus" class="w-7 h-7 text-slate-950 font-bold"></i>
    </button>

    <!-- Settings Modal -->
    <div id="settings-modal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm hidden items-center justify-center p-4 z-50">
        <div class="glass-card p-6 rounded-2xl w-full max-w-sm space-y-4">
            <h3 class="text-lg font-bold text-slate-100 flex items-center gap-2">
                <i data-lucide="settings" class="w-5 h-5"></i> Settings
            </h3>
            <div class="space-y-3 text-sm">
                <div class="flex justify-between items-center">
                    <span>🔔 Notifications</span>
                    <input type="checkbox" checked class="accent-emerald-500 w-4 h-4">
                </div>
                <div class="flex justify-between items-center">
                    <span>📱 PWA Mode</span>
                    <span class="text-xs text-emerald-400 font-semibold">Active</span>
                </div>
            </div>
            <button onclick="toggleSettings()" class="w-full py-2 bg-slate-800 hover:bg-slate-700 rounded-xl font-medium text-xs">Close</button>
        </div>
    </div>

    <script>
        lucide.createIcons();

        // DateTime Tracker
        function updateDateTime() {
            const now = new Date();
            const options = { weekday: 'short', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' };
            document.getElementById('current-datetime').innerText = now.toLocaleDateString('bn-BD', options);
        }
        setInterval(updateDateTime, 1000);
        updateDateTime();

        // Trackers Logic
        let water = 0;
        let sleep = 0;
        let study = 0;
        let prayers = 0;
        let tasks = [
            { text: "সকালের হাাঁটা ও ব্যায়াম", done: false },
            { text: "প্রজেক্টের কাজ সম্পন্ন করা", done: true }
        ];

        function addWater() { if(water < 8) water++; updateTrackers(); }
        function addSleep() { if(sleep < 12) sleep++; updateTrackers(); }
        function addStudy() { study += 0.5; updateTrackers(); }

        function togglePrayer(btn) {
            btn.classList.toggle('bg-emerald-500');
            btn.classList.toggle('text-slate-950');
            prayers = document.querySelectorAll('.bg-emerald-500').length;
            updateTrackers();
        }

        function addTaskPrompt() {
            const taskText = prompt("নতুন টাস্ক লিখুন:");
            if(taskText) {
                tasks.push({ text: taskText, done: false });
                renderTasks();
                updateTrackers();
            }
        }

        function toggleTask(index) {
            tasks[index].done = !tasks[index].done;
            renderTasks();
            updateTrackers();
        }

        function renderTasks() {
            const list = document.getElementById('task-list');
            list.innerHTML = tasks.map((t, i) => `
                <li onclick="toggleTask(${i})" class="flex items-center justify-between p-3 rounded-xl bg-slate-900/50 border border-slate-800/50 cursor-pointer">
                    <span class="text-xs ${t.done ? 'line-through text-slate-500' : 'text-slate-200'}">${t.text}</span>
                    <i data-lucide="${t.done ? 'check-circle' : 'circle'}" class="w-4 h-4 ${t.done ? 'text-emerald-400' : 'text-slate-600'}"></i>
                </li>
            `).join('');
            lucide.createIcons();
        }

        function updateTrackers() {
            document.getElementById('water-count').innerText = water;
            document.getElementById('sleep-count').innerText = sleep;
            document.getElementById('study-count').innerText = study;
            document.getElementById('prayer-count').innerText = `${prayers}/5`;

            // Progress Calculation
            const completedTasks = tasks.filter(t => t.done).length;
            const totalItems = tasks.length + 8 + 8 + 5; // Total scale
            const currentPoints = completedTasks + water + sleep + prayers;
            const percentage = Math.min(Math.round((currentPoints / totalItems) * 100), 100);

            document.getElementById('progress-bar').style.width = `${percentage}%`;
            document.getElementById('progress-text').innerText = `${percentage}%`;
        }

        function toggleSettings() {
            const modal = document.getElementById('settings-modal');
            modal.classList.toggle('hidden');
            modal.classList.toggle('flex');
        }

        renderTasks();
        updateTrackers();
    </script>
</body>
                      </html>
