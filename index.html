<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Life Tracker</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#4f46e5">
</head>
<body>

  <header class="app-header">
    <h1 id="page-title">Dashboard</h1>
    <button id="theme-toggle" class="icon-btn" aria-label="Toggle Theme">🌙</button>
  </header>

  <main id="app-content" class="container">
    <!-- View Dynamic Content Here -->
  </main>

  <nav class="bottom-nav">
    <button class="nav-btn active" data-target="dashboard">
      <span class="icon">🏠</span>
      <span class="label">Home</span>
    </button>
    <button class="nav-btn" data-target="task">
      <span class="icon">✅</span>
      <span class="label">Tasks</span>
    </button>
    <button class="nav-btn" data-target="habit">
      <span class="icon">🔄</span>
      <span class="label">Habits</span>
    </button>
    <button class="nav-btn" data-target="prayer">
      <span class="icon">🕌</span>
      <span class="label">Prayer</span>
    </button>
    <button class="nav-btn" data-target="settings">
      <span class="icon">⚙️</span>
      <span class="label">Settings</span>
    </button>
  </nav>

  <script src="js/storage.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
